# Loaded in addition to src/main/resources/application.yml (Spring Boot also reads
# classpath:/config/application.yml), so tests only override what they need.

# Gemini is never called by the tests; a fake key lets the context start without GEMINI_API_KEY.
spring:
  ai:
    google:
      genai:
        api-key: test-key

financial-coach:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef
  # Gemini is never called: merchants not in the caches get Other (CategorizationTest mocks the classifier).
  categorization:
    llm-enabled: false
  # Tests call RecurringTransactionService.generateDue with fixed dates instead.
  recurring:
    scheduler-enabled: false

# Tests log to the console only: no logs/ folder created by the test run.
logging:
  file:
    name: ""
