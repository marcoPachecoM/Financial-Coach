spring:
  ai:
    # The Google SDK already retries (financial-coach.copilot.attempts); do not retry on top of it.
    retry:
      max-attempts: 1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-4-hydrogen}
            # Cost guards: every output token is billed, thinking tokens included.
            max-output-tokens: 1024
            # Newer Gemini models use a level instead of thinking-budget (do not set both).
            thinking-level: LOW

  application:
    name: financial-coach
  
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Avoid lazy-loading queries during view rendering (hidden N+1 queries).
    open-in-view: false
    properties:
      # CSV imports insert hundreds of rows: send them to PostgreSQL in batches.
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true

  # CSV upload limit of the contract (1 MiB file); larger requests get 413 PAYLOAD_TOO_LARGE.
  # Streamed copilot answers (async requests) may take a while with tool calls; Tomcat's default is 30 s.
  mvc:
    async:
      request-timeout: 90s

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1100KB

  flyway:
    locations: classpath:db/migration

  # JSON conventions of docs/openapi.yaml.
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Unknown fields in a request body are rejected with VALIDATION_ERROR.
      fail-on-unknown-properties: true

financial-coach:
  copilot:
    provider: google-genai
    # How the copilot writes amounts: generic "$" like the frontend, without naming a currency.
    amount-format: "$1,234.56"
    # Each call to the LLM: time limit and tries (2 = one retry when the model is busy).
    timeout: 20s
    attempts: 2
    # Chat memory: last messages per conversation sent back to the model, and conversations kept.
    memory-messages: 10
    memory-conversations: 1000
    # Chat messages per user (429 RATE_LIMIT_EXCEEDED above). The daily limit caps the LLM cost.
    requests-per-minute: ${COPILOT_REQUESTS_PER_MINUTE:10}
    daily-limit: ${COPILOT_DAILY_LIMIT:100}
    # Calls to the LLM for one message (tool loop); above it, 502 COPILOT_CALL_LIMIT. Normal: 2-3.
    max-llm-calls: ${COPILOT_MAX_LLM_CALLS:5}
  jwt:
    # HS256 key, at least 32 bytes. Required: the app does not start without it.
    secret: ${JWT_SECRET_KEY}
    issuer: ${JWT_ISSUER:financial-coach-api}
    audience: ${JWT_AUDIENCE:financial-coach-clients}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  # Browser origins allowed to call the API (comma separated). Default: the Vite dev server.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Requests per minute and client IP on the token endpoints (openapi.yaml).
  rate-limit:
    login: ${RATE_LIMIT_LOGIN:5}
    refresh: ${RATE_LIMIT_REFRESH:10}
    logout: ${RATE_LIMIT_LOGOUT:20}
    # Consecutive failed logins of one email (from any IP) before each new attempt must wait:
    # 30 s, then doubling up to 15 min. A success resets it.
    login-account-failures: ${RATE_LIMIT_LOGIN_ACCOUNT_FAILURES:5}
    # Sign-ups per client IP and hour (no CAPTCHA: this is the protection against bots).
    register: ${RATE_LIMIT_REGISTER:3}
    # Password resets with a recovery code per client IP and minute (failures also count per email).
    password-reset: ${RATE_LIMIT_PASSWORD_RESET:5}
    # Password changes and recovery-code requests per signed-in user and minute.
    account-security: ${RATE_LIMIT_ACCOUNT_SECURITY:10}
    # CSV export and import requests per user and minute (each one reads or writes a whole file).
    csv: ${RATE_LIMIT_CSV:10}
  # Category groups for transactions without one: the user's corrections, the shared merchant cache,
  # then the LLM (only normalized merchant names are sent, many per call), else Other.
  categorization:
    llm-enabled: ${CATEGORIZATION_LLM_ENABLED:true}
    batch-size: ${CATEGORIZATION_BATCH_SIZE:100}
    # LLM calls per import or form request; merchants beyond get Other.
    max-calls-per-request: ${CATEGORIZATION_MAX_CALLS:3}
  # Generator of recurring transactions: daily (server time) and once at startup.
  recurring:
    scheduler-enabled: ${RECURRING_SCHEDULER_ENABLED:true}
    cron: ${RECURRING_CRON:0 5 0 * * *}
  # Daily deletion of expired refresh tokens.
  refresh-token-cleanup:
    enabled: true
    cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}

# Besides the console, a rotating log file (relative to where the app starts: backend/logs/).
# Set LOG_FILE= (empty) to log to the console only, e.g. in containers whose platform keeps stdout.
logging:
  file:
    name: ${LOG_FILE:logs/financial-coach.log}
  logback:
    rollingpolicy:
      # A new file every 10 MB or day; files older than 7 days are deleted, at most 100 MB in total.
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
