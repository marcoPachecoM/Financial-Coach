# Weekly pull requests that update dependencies, plus immediate ones for security advisories
# (enable "Dependabot alerts" and "Dependabot security updates" in the repository settings).
# Minor and patch updates of each ecosystem come grouped in one pull request to limit noise;
# major versions arrive one by one, since they may need code changes.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
