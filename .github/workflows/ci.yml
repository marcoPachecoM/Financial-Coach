name: CI

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Testcontainers starts PostgreSQL in Docker (available on ubuntu-latest runners).
      - name: Build and test (migrations against PostgreSQL)
        run: ./mvnw -B verify

  frontend:
    name: frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Type check and build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # The whole app: PostgreSQL, the backend (dev profile, demo data) and Vite, driven by a real browser.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: financial_coach
          POSTGRES_USER: financial_coach
          POSTGRES_PASSWORD: financial_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_coach -d financial_coach"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Gemini is never called (the e2e profile turns off AI categorization; the tests do not use
      # the chat), but the key must be set for the app to start.
      GEMINI_API_KEY: ci-unused
      VITE_API_URL: http://localhost:8080/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start the backend
        working-directory: backend
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=dev,e2e > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/health && exit 0
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload the report (traces and screenshots of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            backend/backend.log
          retention-days: 7
